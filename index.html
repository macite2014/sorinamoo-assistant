<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>sorinamoo assistant</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    --bg:#0b1120;
    --panel:#151f35;
    --panel2:#1b2944;
    --accent:#3da9fc;
    --accent2:#22d3a5;
    --amber:#fbbf24;
    --purple:#a78bfa;
    --warn:#f59e0b;
    --danger:#ef4444;
    --text:#eef2f9;
    --sub:#8a99b8;
    --border:#243453;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  button{font-family:inherit;}
  input,select{font-family:inherit;}

  /* ---------- Decorative animated background ---------- */
  .bg-blobs{position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none;}
  .bg-blobs span{
    position:absolute; border-radius:50%; filter:blur(60px); opacity:.22;
    animation:float 22s ease-in-out infinite alternate;
  }
  .bg-blobs span:nth-child(1){width:340px; height:340px; background:var(--accent); top:-120px; left:-80px;}
  .bg-blobs span:nth-child(2){width:300px; height:300px; background:var(--accent2); bottom:-100px; right:-60px; animation-duration:26s; animation-delay:2s;}
  .bg-blobs span:nth-child(3){width:220px; height:220px; background:var(--purple); top:40%; left:60%; animation-duration:30s; animation-delay:4s;}
  @keyframes float{
    0%{transform:translate(0,0) scale(1);}
    50%{transform:translate(30px,-20px) scale(1.08);}
    100%{transform:translate(-20px,15px) scale(.96);}
  }
  @keyframes fadeInUp{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  @keyframes pulseRing{
    0%{box-shadow:0 0 0 0 rgba(34,211,165,.45);}
    70%{box-shadow:0 0 0 8px rgba(34,211,165,0);}
    100%{box-shadow:0 0 0 0 rgba(34,211,165,0);}
  }
  @keyframes glowPulse{
    0%,100%{filter:drop-shadow(0 0 2px currentColor);}
    50%{filter:drop-shadow(0 0 7px currentColor);}
  }
  @keyframes flashUpdate{
    0%{background:rgba(61,169,252,.25);}
    100%{background:transparent;}
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- Layout shells ---------- */
  #app{display:none;}
  #app.ready{display:flex; flex-direction:column; min-height:100vh;}
  #gate{display:flex; min-height:100vh; align-items:center; justify-content:center; padding:24px;}

  .gate-card{
    width:100%; max-width:420px; background:var(--panel); border:1px solid var(--border);
    border-radius:var(--radius); padding:30px; box-shadow:0 24px 70px rgba(0,0,0,.45);
    animation:fadeInUp .5s ease both;
  }
  .gate-logo{
    width:48px; height:48px; border-radius:14px; margin-bottom:14px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex; align-items:center; justify-content:center;
  }
  .gate-logo svg{width:26px; height:26px; color:#08233f;}
  .gate-card h1{font-size:19px; margin:0 0 6px; font-weight:800; letter-spacing:-.01em;}
  .gate-card p{color:var(--sub); font-size:13px; margin:0 0 22px; line-height:1.55;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--sub); margin-bottom:6px; font-weight:600;}
  .field input{
    width:100%; padding:12px 13px; border-radius:11px; border:1px solid var(--border);
    background:#0d1729; color:var(--text); font-size:14px; outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .field input:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(61,169,252,.15);}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    border:none; border-radius:11px; padding:12px 16px; font-size:14px; font-weight:700;
    cursor:pointer; transition:transform .08s ease, opacity .15s, box-shadow .15s;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:linear-gradient(135deg,var(--accent),#2f8fe0); color:#06182c; width:100%; box-shadow:0 8px 20px rgba(61,169,252,.25);}
  .btn-ghost{background:transparent; color:var(--sub); border:1px solid var(--border); width:100%; margin-top:8px;}
  .btn-ghost:hover{color:var(--text); border-color:var(--accent);}
  .gate-error{color:var(--danger); font-size:12px; margin-top:10px; min-height:14px;}
  .gate-demo{margin-top:20px; padding-top:18px; border-top:1px dashed var(--border); text-align:center;}
  .gate-demo span{font-size:11px; color:var(--sub);}

  /* ---------- Header ---------- */
  header{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:14px 18px; background:rgba(11,17,32,.85); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10;
  }
  .brand{display:flex; align-items:center; gap:11px; min-width:0;}
  .dot-wrap{width:11px; height:11px; border-radius:50%; flex:none; position:relative;}
  .dot-wrap .dot{width:100%; height:100%; border-radius:50%; background:var(--danger); transition:background .3s;}
  .dot-wrap.on .dot{background:var(--accent2); animation:pulseRing 2s ease-out infinite;}
  .brand-name{font-size:16px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:-.01em;}
  .brand-sub{font-size:11px; color:var(--sub); display:flex; align-items:center; gap:5px;}
  .head-actions{display:flex; align-items:center; gap:8px;}
  .icon-btn{
    width:38px;height:38px;border-radius:11px;border:1px solid var(--border);
    background:var(--panel2); color:var(--text); display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:16px; transition:transform .15s, border-color .15s;
  }
  .icon-btn:active{transform:scale(.92) rotate(8deg);}
  .icon-btn svg{width:18px; height:18px;}
  .icon-btn.spinning svg{animation:spin .6s linear;}

  /* ---------- Tabs ---------- */
  nav.tabs{
    display:flex; gap:6px; padding:12px 14px; overflow-x:auto; background:rgba(11,17,32,.4);
    border-bottom:1px solid var(--border); -webkit-overflow-scrolling:touch;
  }
  nav.tabs button{
    flex:none; display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--border); background:var(--panel); color:var(--sub);
    padding:8px 14px; border-radius:999px; font-size:13px; cursor:pointer; white-space:nowrap;
    transition:background .15s, color .15s, border-color .15s, transform .1s;
  }
  nav.tabs button svg{width:14px; height:14px;}
  nav.tabs button.active{background:linear-gradient(135deg,var(--accent),#2f8fe0); color:#06182c; border-color:transparent; font-weight:700;}
  nav.tabs button:active{transform:scale(.96);}

  .search-row{padding:12px 14px 0; display:flex; gap:8px;}
  .search-row input{
    flex:1; padding:11px 14px; border-radius:11px; border:1px solid var(--border);
    background:#0d1729; color:var(--text); font-size:13px; outline:none;
    transition:border-color .15s;
  }
  .search-row input:focus{border-color:var(--accent);}

  /* ---------- Content ---------- */
  main{flex:1; padding:16px; padding-bottom:48px;}
  .section-title{
    display:flex; align-items:center; gap:8px; font-size:12px; color:var(--sub);
    margin:20px 4px 10px; text-transform:uppercase; letter-spacing:.06em; font-weight:700;
  }
  .section-title .count{
    background:var(--panel2); color:var(--text); border-radius:999px; padding:1px 8px;
    font-size:11px; font-weight:700; letter-spacing:0;
  }
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px;}
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:15px; display:flex; flex-direction:column; gap:12px; min-height:104px;
    transition:transform .15s ease, border-color .2s, background .2s, box-shadow .2s;
  }
  .card.enter{
    animation:fadeInUp .4s ease both;
    animation-delay:calc(var(--i, 0) * 35ms);
  }
  .card:hover{transform:translateY(-2px); box-shadow:0 10px 26px rgba(0,0,0,.28);}
  .card.on{border-color:rgba(61,169,252,.45); background:linear-gradient(160deg,var(--panel2),var(--panel));}
  .card-top{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .card-id{display:flex; align-items:center; gap:10px; min-width:0; flex:1;}
  .card-id > div{min-width:0; flex:1;}
  .icon-badge{
    width:34px; height:34px; border-radius:10px; flex:none; display:flex; align-items:center; justify-content:center;
    background:#0d1729; color:var(--sub); transition:background .25s, color .25s;
  }
  .icon-badge svg{width:18px; height:18px;}
  .icon-badge.glow{animation:glowPulse 2.4s ease-in-out infinite;}
  .card-name{
    font-size:13.5px; font-weight:700; line-height:1.32; min-width:0;
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden;
  }
  .card-state{font-size:11px; color:var(--sub); margin-top:2px;}
  .toggle{
    width:46px; height:27px; border-radius:999px; background:#243453; position:relative; cursor:pointer;
    border:none; flex:none; transition:background .2s;
  }
  .toggle.on{background:var(--accent2);}
  .toggle .knob{
    position:absolute; top:3px; left:3px; width:21px; height:21px; border-radius:50%;
    background:#fff; transition:left .2s cubic-bezier(.4,0,.2,1); box-shadow:0 2px 4px rgba(0,0,0,.3);
  }
  .toggle.on .knob{left:22px;}
  .slider-row{display:flex; align-items:center; gap:10px;}
  .slider-row input[type=range]{
    flex:1; -webkit-appearance:none; appearance:none; height:6px; border-radius:999px;
    background:#243453; outline:none; cursor:pointer;
  }
  .slider-row input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:17px; height:17px; border-radius:50%; background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.4); cursor:pointer; margin-top:0;
  }
  .slider-row input[type=range]::-moz-range-thumb{
    width:17px; height:17px; border-radius:50%; background:#fff; border:none; box-shadow:0 1px 3px rgba(0,0,0,.4);
  }
  .slider-val{font-size:11px; color:var(--sub); width:34px; text-align:right; font-weight:600;}
  .run-btn{
    align-self:flex-start; display:inline-flex; align-items:center; gap:6px;
    background:linear-gradient(135deg,var(--purple),#8b6cf0); color:#1a1033; border:none; border-radius:9px;
    padding:9px 14px; font-size:12px; font-weight:700; cursor:pointer; transition:transform .1s;
  }
  .run-btn:active{transform:scale(.95);}
  .run-btn svg{width:12px; height:12px;}
  .sensor-value{font-size:24px; font-weight:800; letter-spacing:-.02em; transition:color .2s;}
  .sensor-unit{font-size:12px; color:var(--sub); margin-left:4px; font-weight:600;}
  .level-bar{height:5px; border-radius:999px; background:#243453; overflow:hidden; margin-top:2px;}
  .level-bar i{display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .4s ease;}
  .flash{animation:flashUpdate 1s ease;}
  .empty{color:var(--sub); font-size:13px; text-align:center; padding:60px 10px; display:flex; flex-direction:column; align-items:center; gap:12px;}
  .empty svg{width:40px; height:40px; opacity:.4;}
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(8px);
    background:#1b2944; border:1px solid var(--border); color:var(--text);
    padding:11px 18px; border-radius:11px; font-size:13px; z-index:50; opacity:0;
    transition:opacity .25s, transform .25s; box-shadow:0 10px 30px rgba(0,0,0,.45);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ---------- Settings modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(5,9,18,.65); display:none; align-items:center; justify-content:center;
    z-index:100; padding:20px; backdrop-filter:blur(2px);
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:24px; width:100%; max-width:420px; max-height:90vh; overflow-y:auto;
    animation:fadeInUp .25s ease both;
  }
  .modal h2{font-size:16px; margin:0 0 16px; font-weight:800;}
  .modal-foot{display:flex; gap:8px; margin-top:16px;}
  .modal-foot .btn{flex:1;}
</style>
</head>
<body>

<div class="bg-blobs"><span></span><span></span><span></span></div>

<!-- ===================== 연결 화면 ===================== -->
<div id="gate">
  <div class="gate-card">
    <div class="gate-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M3 12h3M18 12h3M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>
    </div>
    <h1 id="gateTitle">sorinamoo assistant 연결</h1>
    <p>Home&nbsp;Assistant 서버 주소와 장기 액세스 토큰(Long-Lived Access Token)을 입력하면, 이 화면이 sorinamoo assistant 전용 제어 앱으로 전환됩니다.</p>
    <div class="field">
      <label>브랜드/현장 이름</label>
      <input id="inBrand" placeholder="예: sorinamoo assistant" value="sorinamoo assistant" />
    </div>
    <div class="field">
      <label>Home Assistant 서버 주소</label>
      <input id="inUrl" placeholder="http://192.168.0.10:8123" />
    </div>
    <div class="field">
      <label>Long-Lived Access Token</label>
      <input id="inToken" type="password" placeholder="프로필 &gt; 보안 탭에서 발급" />
    </div>
    <button class="btn btn-primary" onclick="connectFromGate()">연결하기</button>
    <div class="gate-error" id="gateError"></div>
    <div class="gate-demo">
      <button class="btn btn-ghost" onclick="enterDemo()">서버 없이 데모로 먼저 체험하기</button>
      <div style="margin-top:8px;"><span>토큰 발급: HA 화면 우측 하단 프로필 → 보안 탭 → "토큰 만들기"</span></div>
    </div>
  </div>
</div>

<!-- ===================== 메인 앱 ===================== -->
<div id="app">
  <header>
    <div class="brand">
      <div class="dot-wrap" id="connDotWrap"><div class="dot"></div></div>
      <div>
        <div class="brand-name" id="brandName">sorinamoo assistant</div>
        <div class="brand-sub" id="brandSub">연결 중...</div>
      </div>
    </div>
    <div class="head-actions">
      <button class="icon-btn" id="refreshBtn" title="새로고침" onclick="refreshNow(true)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg>
      </button>
      <button class="icon-btn" title="설정" onclick="openSettings()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      </button>
    </div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <div class="search-row">
    <input id="searchBox" placeholder="기기 이름으로 검색..." oninput="render()" />
  </div>

  <main id="main"></main>
</div>

<div class="toast" id="toast"></div>

<!-- ===================== 설정 모달 ===================== -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h2>설정</h2>
    <div class="field">
      <label>브랜드/현장 이름</label>
      <input id="setBrand" />
    </div>
    <div class="field">
      <label>Home Assistant 서버 주소</label>
      <input id="setUrl" />
    </div>
    <div class="field">
      <label>Long-Lived Access Token</label>
      <input id="setToken" type="password" />
    </div>
    <div class="field">
      <label>자동 새로고침 주기 (초)</label>
      <input id="setPoll" type="number" min="2" max="60" />
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeSettings()">취소</button>
      <button class="btn btn-primary" onclick="saveSettings()">저장</button>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" style="color:var(--danger);" onclick="disconnect()">연결 해제 / 로그아웃</button>
    </div>
  </div>
</div>

<script>
/* =========================================================================
   아이콘 (도메인별 SVG)
   ========================================================================= */
const ICONS = {
  light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.2 11.1c.4.3.7.8.7 1.4v.5h5v-.5c0-.6.3-1.1.7-1.4A6 6 0 0 0 12 3Z"/></svg>',
  switch: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v8"/><path d="M7.4 6.5a7 7 0 1 0 9.2 0"/></svg>',
  media_player: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h3l5-4.2v14.4L7 15H4z"/><path d="M16.2 9a4 4 0 0 1 0 6"/><path d="M19 7a8 8 0 0 1 0 10"/></svg>',
  sensor: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 14V4a2 2 0 1 0-4 0v10a4 4 0 1 0 4 0Z"/></svg>',
  binary_sensor: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.4-7 10-7 10 7 10 7-3.4 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="2.6"/></svg>',
  climate: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M4.5 7.5l15 9M19.5 7.5l-15 9"/></svg>',
  scene: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l5.5 3.5-5.5 3.5V8.5Z" fill="currentColor" stroke="none"/></svg>',
  script: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l5.5 3.5-5.5 3.5V8.5Z" fill="currentColor" stroke="none"/></svg>',
  default: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/></svg>'
};
const TAB_ICONS = {
  all: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
  light: ICONS.light, switch: ICONS.switch, media_player: ICONS.media_player,
  sensor: ICONS.sensor, scene: ICONS.scene
};

/* =========================================================================
   상태 저장 (localStorage)
   ========================================================================= */
const STORAGE_KEY = "ops-console-config-v1";

function loadConfig(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || null; }catch(e){ return null; }
}
function saveConfig(cfg){ localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg)); }

let CFG = loadConfig();           // {brand, url, token, poll, demo}
let ENTITIES = [];                // 현재 상태 캐시
let PREV_VALUES = {};             // 변경 감지용 (깜빡임 효과)
let ACTIVE_TAB = "all";
let HAS_RENDERED = false;         // 첫 렌더링 이후엔 카드 등장 애니메이션 생략(깜빡임 방지)
let pollTimer = null;
let tickTimer = null;
let lastUpdateAt = null;

/* =========================================================================
   데모 데이터
   ========================================================================= */
function demoEntities(){
  return [
    {entity_id:"light.stage_main", state:"on", attributes:{friendly_name:"메인 무대 조명", brightness:200, supported_color_modes:["brightness"]}},
    {entity_id:"light.stage_side", state:"off", attributes:{friendly_name:"보조 조명", brightness:0, supported_color_modes:["brightness"]}},
    {entity_id:"switch.entrance_led", state:"on", attributes:{friendly_name:"입구 LED 사인"}},
    {entity_id:"switch.water_feature", state:"off", attributes:{friendly_name:"분수 장치"}},
    {entity_id:"media_player.main_speaker", state:"playing", attributes:{friendly_name:"메인 음향 시스템", volume_level:0.6}},
    {entity_id:"sensor.outdoor_temp", state:"24.5", attributes:{friendly_name:"현장 기온", unit_of_measurement:"°C"}},
    {entity_id:"sensor.crowd_noise", state:"68", attributes:{friendly_name:"소음 레벨", unit_of_measurement:"dB"}},
    {entity_id:"binary_sensor.gate_motion", state:"off", attributes:{friendly_name:"출입구 동작감지"}},
    {entity_id:"scene.opening_cue", state:"scening", attributes:{friendly_name:"오프닝 큐"}},
    {entity_id:"scene.finale_cue", state:"scening", attributes:{friendly_name:"피날레 큐"}},
    {entity_id:"script.emergency_lights", state:"off", attributes:{friendly_name:"비상 조명 전환"}},
  ];
}

/* 데모 모드에서 살짝씩 흔들리는 센서값 (생동감) */
function jitterDemoSensors(){
  if(!CFG || !CFG.demo) return;
  ENTITIES.forEach(e=>{
    if(e.entity_id === "sensor.outdoor_temp"){
      const v = parseFloat(e.state) + (Math.random()-0.5)*0.4;
      e.state = v.toFixed(1);
    }
    if(e.entity_id === "sensor.crowd_noise"){
      const v = Math.max(30, Math.min(95, parseFloat(e.state) + (Math.random()-0.5)*6));
      e.state = Math.round(v).toString();
    }
  });
}

/* =========================================================================
   화면 전환
   ========================================================================= */
function showApp(){
  document.getElementById("gate").style.display = "none";
  document.getElementById("app").classList.add("ready");
}
function showGate(){
  document.getElementById("app").classList.remove("ready");
  document.getElementById("gate").style.display = "flex";
}

function connectFromGate(){
  const brand = document.getElementById("inBrand").value.trim() || "sorinamoo assistant";
  const url = document.getElementById("inUrl").value.trim().replace(/\/$/,"");
  const token = document.getElementById("inToken").value.trim();
  const errEl = document.getElementById("gateError");
  errEl.textContent = "";

  if(!url || !token){
    errEl.textContent = "서버 주소와 토큰을 모두 입력해주세요.";
    return;
  }
  CFG = {brand, url, token, poll:5, demo:false};
  saveConfig(CFG);
  testConnectionThenStart(true);
}

function enterDemo(){
  CFG = {brand:"sorinamoo assistant (데모)", url:"", token:"", poll:5, demo:true};
  saveConfig(CFG);
  startApp();
}

/* =========================================================================
   HA API
   ========================================================================= */
async function haFetch(path, opts={}){
  const res = await fetch(CFG.url + path, {
    ...opts,
    headers:{
      "Authorization": "Bearer " + CFG.token,
      "Content-Type": "application/json",
      ...(opts.headers||{})
    }
  });
  if(!res.ok) throw new Error("HTTP " + res.status);
  return res.status === 204 ? null : res.json();
}

async function testConnectionThenStart(fromGate){
  try{
    await haFetch("/api/");
    if(fromGate) startApp();
  }catch(e){
    if(fromGate){
      document.getElementById("gateError").textContent =
        "연결 실패: 주소/토큰을 확인하거나 CORS 설정을 확인해주세요. (" + e.message + ")";
    }
  }
}

async function fetchStates(){
  if(CFG.demo){
    if(!ENTITIES.length) ENTITIES = demoEntities();
    jitterDemoSensors();
    return ENTITIES;
  }
  return await haFetch("/api/states");
}

async function callService(domain, service, data){
  if(CFG.demo){
    applyDemoChange(domain, service, data);
    return;
  }
  await haFetch(`/api/services/${domain}/${service}`, {
    method:"POST",
    body: JSON.stringify(data || {})
  });
}

function applyDemoChange(domain, service, data){
  const ent = ENTITIES.find(e => e.entity_id === data.entity_id);
  if(!ent) return;
  if(service === "turn_on"){
    ent.state = domain === "media_player" ? "playing" : "on";
    if(data.brightness_pct !== undefined) ent.attributes.brightness = Math.round(data.brightness_pct * 2.55);
    if(data.volume_level !== undefined) ent.attributes.volume_level = data.volume_level;
  } else if(service === "turn_off"){
    ent.state = "off";
  } else if(service === "media_pause"){
    ent.state = "paused";
  } else if(service === "media_play"){
    ent.state = "playing";
  } else if(service === "volume_set"){
    ent.attributes.volume_level = data.volume_level;
  }
  render();
}

/* =========================================================================
   메인 루프
   ========================================================================= */
function startApp(){
  document.getElementById("brandName").textContent = CFG.brand || "sorinamoo assistant";
  document.getElementById("setBrand").value = CFG.brand || "";
  document.getElementById("setUrl").value = CFG.url || "";
  document.getElementById("setToken").value = CFG.token || "";
  document.getElementById("setPoll").value = CFG.poll || 5;
  showApp();
  buildTabs();
  refreshNow();
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(refreshNow, Math.max(2,(CFG.poll||5)) * 1000);
  if(tickTimer) clearInterval(tickTimer);
  tickTimer = setInterval(updateSubLabel, 1000);
}

async function refreshNow(manual){
  const btn = document.getElementById("refreshBtn");
  if(manual && btn) btn.classList.add("spinning");
  const dotWrap = document.getElementById("connDotWrap");
  try{
    ENTITIES = await fetchStates();
    dotWrap.classList.add("on");
    lastUpdateAt = Date.now();
    updateSubLabel();
    render();
  }catch(e){
    dotWrap.classList.remove("on");
    document.getElementById("brandSub").textContent = "연결 끊김";
    showToast("업데이트 실패: " + e.message);
  }
  if(manual && btn) setTimeout(()=>btn.classList.remove("spinning"), 500);
}

function updateSubLabel(){
  const sub = document.getElementById("brandSub");
  if(!lastUpdateAt){ sub.textContent = "연결 중..."; return; }
  const secs = Math.max(0, Math.round((Date.now()-lastUpdateAt)/1000));
  const base = CFG.demo ? "데모 모드" : (ENTITIES.length + "개 기기 연결됨");
  sub.textContent = base + " · " + (secs < 2 ? "방금 업데이트" : secs + "초 전 업데이트");
}

/* =========================================================================
   분류 / 탭
   ========================================================================= */
const TAB_DEFS = [
  {id:"all", label:"전체", match:()=>true},
  {id:"light", label:"조명", match:e=>e.entity_id.startsWith("light.")},
  {id:"switch", label:"스위치/설치물", match:e=>e.entity_id.startsWith("switch.")||e.entity_id.startsWith("input_boolean.")},
  {id:"media_player", label:"음향", match:e=>e.entity_id.startsWith("media_player.")},
  {id:"sensor", label:"센서/환경", match:e=>e.entity_id.startsWith("sensor.")||e.entity_id.startsWith("binary_sensor.")||e.entity_id.startsWith("climate.")},
  {id:"scene", label:"장면/자동화", match:e=>e.entity_id.startsWith("scene.")||e.entity_id.startsWith("script.")||e.entity_id.startsWith("automation.")},
];

function buildTabs(){
  const nav = document.getElementById("tabs");
  nav.innerHTML = "";
  TAB_DEFS.forEach(t=>{
    const b = document.createElement("button");
    b.innerHTML = (TAB_ICONS[t.id]||"") + "<span>" + t.label + "</span>";
    b.className = t.id === ACTIVE_TAB ? "active" : "";
    b.onclick = ()=>{ ACTIVE_TAB = t.id; HAS_RENDERED = false; buildTabs(); render(); };
    nav.appendChild(b);
  });
}

/* =========================================================================
   렌더링
   ========================================================================= */
function domainOf(id){ return id.split(".")[0]; }
function nameOf(e){ return (e.attributes && e.attributes.friendly_name) || e.entity_id; }
function iconFor(d){ return ICONS[d] || ICONS.default; }

function render(){
  const main = document.getElementById("main");
  const q = (document.getElementById("searchBox").value || "").toLowerCase();
  const tabDef = TAB_DEFS.find(t=>t.id===ACTIVE_TAB) || TAB_DEFS[0];

  let list = ENTITIES.filter(tabDef.match);
  if(q) list = list.filter(e => nameOf(e).toLowerCase().includes(q));

  if(list.length === 0){
    main.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <div>표시할 기기가 없습니다.</div>
    </div>`;
    return;
  }

  const groups = {};
  list.forEach(e=>{
    const d = domainOf(e.entity_id);
    (groups[d] = groups[d]||[]).push(e);
  });

  let html = "";
  let idx = 0;
  Object.keys(groups).sort().forEach(d=>{
    const items = groups[d];
    const onCount = items.filter(e=>["on","playing","home"].includes(e.state)).length;
    html += `<div class="section-title">${iconSpan(iconFor(d))}<span>${domainLabel(d)}</span><span class="count">${items.length}${onCount?` · ${onCount}개 작동중`:""}</span></div><div class="grid">`;
    items.forEach(e=>{ html += cardHtml(e, idx++); });
    html += `</div>`;
  });
  main.innerHTML = html;
  HAS_RENDERED = true;
}

function iconSpan(svg){ return `<span style="width:14px;height:14px;display:inline-flex;">${svg}</span>`; }

function domainLabel(d){
  return ({
    light:"조명", switch:"스위치", input_boolean:"스위치", media_player:"음향",
    sensor:"센서", binary_sensor:"감지 센서", climate:"환경 제어",
    scene:"장면", script:"스크립트", automation:"자동화"
  })[d] || d;
}

/* 센서값 정규화(레벨 바 표시용) */
function levelPct(unit, value){
  const v = parseFloat(value);
  if(isNaN(v)) return null;
  const ranges = {
    "°C":[-10,40], "%":[0,100], "dB":[20,100], "lx":[0,1000], "ppm":[0,2000]
  };
  const r = ranges[unit] || [0,100];
  const pct = ((v - r[0]) / (r[1]-r[0])) * 100;
  return Math.max(2, Math.min(100, pct));
}

function cardHtml(e, idx){
  const d = domainOf(e.entity_id);
  const name = nameOf(e);
  const isOn = ["on","playing","home"].includes(e.state);
  const enterClass = HAS_RENDERED ? "" : "enter";
  const style = `style="--i:${idx}"`;

  if(d === "light" || d === "switch" || d === "input_boolean"){
    const hasBrightness = d === "light" && e.attributes && e.attributes.supported_color_modes &&
      e.attributes.supported_color_modes.includes("brightness");
    const brightPct = hasBrightness ? Math.round(((e.attributes.brightness||0)/255)*100) : null;
    const onBg = isOn ? (d==="light" ? "rgba(251,191,36,.18)" : "rgba(34,211,165,.18)") : "";
    const onColor = isOn ? (d==="light" ? "var(--amber)" : "var(--accent2)") : "";
    return `
      <div class="card ${enterClass} ${isOn?'on':''}" ${style} title="${esc(e.entity_id)}">
        <div class="card-top">
          <div class="card-id">
            <div class="icon-badge ${isOn?'glow':''}" ${isOn?`style="background:${onBg}; color:${onColor}"`:""}>${iconFor(d)}</div>
            <div class="card-name">${esc(name)}</div>
          </div>
          <button class="toggle ${isOn?'on':''}" onclick="toggleEntity('${e.entity_id}','${d}',${isOn})">
            <span class="knob"></span>
          </button>
        </div>
        ${hasBrightness ? `
        <div class="slider-row">
          <input type="range" min="1" max="100" value="${brightPct}" style="background:linear-gradient(to right, var(--amber) ${brightPct}%, #243453 ${brightPct}%)" oninput="this.style.background='linear-gradient(to right, var(--amber) '+this.value+'%, #243453 '+this.value+'%)'; setBrightness('${e.entity_id}',this.value); this.nextElementSibling.textContent=this.value+'%'">
          <span class="slider-val">${brightPct}%</span>
        </div>` : `<div class="card-state">${isOn?'켜짐':'꺼짐'}</div>`}
      </div>`;
  }

  if(d === "media_player"){
    const vol = Math.round((e.attributes && e.attributes.volume_level || 0)*100);
    const stateLabel = {playing:"재생 중", paused:"일시정지", idle:"대기", off:"꺼짐"}[e.state] || e.state;
    return `
      <div class="card ${enterClass} ${isOn?'on':''}" ${style} title="${esc(e.entity_id)}">
        <div class="card-top">
          <div class="card-id">
            <div class="icon-badge ${isOn?'glow':''}" ${isOn?`style="background:rgba(61,169,252,.18); color:var(--accent)"`:""}>${iconFor(d)}</div>
            <div>
              <div class="card-name">${esc(name)}</div>
              <div class="card-state">${esc(stateLabel)}</div>
            </div>
          </div>
          <button class="toggle ${isOn?'on':''}" onclick="toggleMedia('${e.entity_id}',${isOn})">
            <span class="knob"></span>
          </button>
        </div>
        <div class="slider-row">
          <input type="range" min="0" max="100" value="${vol}" style="background:linear-gradient(to right, var(--accent) ${vol}%, #243453 ${vol}%)" oninput="this.style.background='linear-gradient(to right, var(--accent) '+this.value+'%, #243453 '+this.value+'%)'; setVolume('${e.entity_id}',this.value); this.nextElementSibling.textContent=this.value+'%'">
          <span class="slider-val">${vol}%</span>
        </div>
      </div>`;
  }

  if(d === "sensor" || d === "binary_sensor"){
    const unit = (e.attributes && e.attributes.unit_of_measurement) || "";
    const pct = levelPct(unit, e.state);
    const key = e.entity_id;
    const changed = PREV_VALUES[key] !== undefined && PREV_VALUES[key] !== e.state;
    PREV_VALUES[key] = e.state;
    return `
      <div class="card ${enterClass} ${changed?'flash':''}" ${style} title="${esc(e.entity_id)}">
        <div class="card-id">
          <div class="icon-badge">${iconFor(d)}</div>
          <div class="card-name">${esc(name)}</div>
        </div>
        <div><span class="sensor-value">${esc(e.state)}</span><span class="sensor-unit">${esc(unit)}</span></div>
        ${pct!==null ? `<div class="level-bar"><i style="width:${pct}%"></i></div>` : ``}
      </div>`;
  }

  if(d === "scene" || d === "script"){
    return `
      <div class="card ${enterClass}" ${style} title="${esc(e.entity_id)}">
        <div class="card-id">
          <div class="icon-badge" style="background:rgba(167,139,250,.18); color:var(--purple)">${iconFor(d)}</div>
          <div class="card-name">${esc(name)}</div>
        </div>
        <button class="run-btn" onclick="runScene('${e.entity_id}','${d}')">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> 실행
        </button>
      </div>`;
  }

  return `
    <div class="card ${enterClass}" ${style} title="${esc(e.entity_id)}">
      <div class="card-id">
        <div class="icon-badge">${iconFor(d)}</div>
        <div class="card-name">${esc(name)}</div>
      </div>
      <div class="card-state">${esc(e.state)}</div>
    </div>`;
}

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* =========================================================================
   동작
   ========================================================================= */
async function toggleEntity(entityId, domain, isOn){
  try{
    await callService(domain === "input_boolean" ? "input_boolean" : domain, isOn ? "turn_off" : "turn_on", {entity_id:entityId});
    showToast((isOn?"끄기":"켜기") + " 명령 전송됨");
    setTimeout(refreshNow, 400);
  }catch(e){ showToast("명령 실패: " + e.message); }
}

async function setBrightness(entityId, pct){
  try{
    await callService("light", "turn_on", {entity_id:entityId, brightness_pct:Number(pct)});
  }catch(e){ showToast("밝기 조절 실패: " + e.message); }
}

async function toggleMedia(entityId, isOn){
  try{
    await callService("media_player", isOn?"media_pause":"media_play", {entity_id:entityId});
    setTimeout(refreshNow, 400);
  }catch(e){ showToast("명령 실패: " + e.message); }
}

async function setVolume(entityId, pct){
  try{
    await callService("media_player", "volume_set", {entity_id:entityId, volume_level:Number(pct)/100});
  }catch(e){ showToast("볼륨 조절 실패: " + e.message); }
}

async function runScene(entityId, domain){
  try{
    await callService(domain, "turn_on", {entity_id:entityId});
    showToast("실행됨: " + entityId);
    setTimeout(refreshNow, 400);
  }catch(e){ showToast("실행 실패: " + e.message); }
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove("show"), 2500);
}

/* =========================================================================
   설정 모달
   ========================================================================= */
function openSettings(){ document.getElementById("settingsModal").classList.add("open"); }
function closeSettings(){ document.getElementById("settingsModal").classList.remove("open"); }

function saveSettings(){
  CFG.brand = document.getElementById("setBrand").value.trim() || "sorinamoo assistant";
  CFG.url = document.getElementById("setUrl").value.trim().replace(/\/$/,"");
  CFG.token = document.getElementById("setToken").value.trim();
  CFG.poll = Number(document.getElementById("setPoll").value) || 5;
  saveConfig(CFG);
  closeSettings();
  startApp();
}

function disconnect(){
  localStorage.removeItem(STORAGE_KEY);
  CFG = null;
  if(pollTimer) clearInterval(pollTimer);
  if(tickTimer) clearInterval(tickTimer);
  closeSettings();
  showGate();
}

/* =========================================================================
   초기 진입
   ========================================================================= */
(function init(){
  if(CFG && (CFG.demo || (CFG.url && CFG.token))){
    startApp();
  }else{
    showGate();
  }
})();

/* PWA Service Worker 등록 */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("service-worker.js").catch(()=>{});
  });
}
