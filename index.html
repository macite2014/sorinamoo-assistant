<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>sorinamoo assistant</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    --bg:#0f172a;
    --panel:#16213a;
    --panel2:#1c2c4d;
    --accent:#3da9fc;
    --accent2:#22d3a5;
    --warn:#f59e0b;
    --danger:#ef4444;
    --text:#e6ecf5;
    --sub:#90a0bd;
    --border:#26345a;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
    background:linear-gradient(180deg,#0b1120,#0f1b33 40%,#0b1120);
    color:var(--text);
    min-height:100vh;
  }
  button{font-family:inherit;}
  input,select{font-family:inherit;}

  /* ---------- Layout shells ---------- */
  #app{display:none;}
  #app.ready{display:flex; flex-direction:column; min-height:100vh;}
  #gate{display:flex; min-height:100vh; align-items:center; justify-content:center; padding:24px;}

  .gate-card{
    width:100%; max-width:420px; background:var(--panel); border:1px solid var(--border);
    border-radius:var(--radius); padding:28px; box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  .gate-card h1{font-size:20px; margin:0 0 4px;}
  .gate-card p{color:var(--sub); font-size:13px; margin:0 0 20px; line-height:1.5;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--sub); margin-bottom:6px;}
  .field input{
    width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--border);
    background:#0d1729; color:var(--text); font-size:14px; outline:none;
  }
  .field input:focus{border-color:var(--accent);}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    border:none; border-radius:10px; padding:11px 16px; font-size:14px; font-weight:600;
    cursor:pointer; transition:transform .05s ease, opacity .15s;
  }
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--accent); color:#08233f; width:100%;}
  .btn-ghost{background:transparent; color:var(--sub); border:1px solid var(--border); width:100%; margin-top:8px;}
  .btn-small{padding:7px 12px; font-size:12px; border-radius:8px;}
  .gate-error{color:var(--danger); font-size:12px; margin-top:8px; min-height:14px;}
  .gate-demo{margin-top:18px; padding-top:16px; border-top:1px dashed var(--border); text-align:center;}
  .gate-demo span{font-size:11px; color:var(--sub);}

  /* ---------- Header ---------- */
  header{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:14px 18px; background:rgba(13,23,41,.9); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10;
  }
  .brand{display:flex; align-items:center; gap:10px; min-width:0;}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--danger); flex:none; box-shadow:0 0 0 0 rgba(239,68,68,.6);}
  .brand .dot.on{background:var(--accent2); box-shadow:0 0 0 4px rgba(34,211,165,.15);}
  .brand-name{font-size:16px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .brand-sub{font-size:11px; color:var(--sub);}
  .head-actions{display:flex; align-items:center; gap:8px;}
  .icon-btn{
    width:36px;height:36px;border-radius:10px;border:1px solid var(--border);
    background:var(--panel2); color:var(--text); display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:16px;
  }

  /* ---------- Tabs ---------- */
  nav.tabs{
    display:flex; gap:6px; padding:10px 14px; overflow-x:auto; background:rgba(13,23,41,.5);
    border-bottom:1px solid var(--border); -webkit-overflow-scrolling:touch;
  }
  nav.tabs button{
    flex:none; border:1px solid var(--border); background:var(--panel); color:var(--sub);
    padding:8px 14px; border-radius:999px; font-size:13px; cursor:pointer; white-space:nowrap;
  }
  nav.tabs button.active{background:var(--accent); color:#08233f; border-color:var(--accent); font-weight:700;}

  .search-row{padding:10px 14px 0; display:flex; gap:8px;}
  .search-row input{
    flex:1; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
    background:#0d1729; color:var(--text); font-size:13px; outline:none;
  }

  /* ---------- Content ---------- */
  main{flex:1; padding:14px; padding-bottom:40px;}
  .section-title{font-size:12px; color:var(--sub); margin:18px 4px 8px; text-transform:uppercase; letter-spacing:.04em;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px;}
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px; display:flex; flex-direction:column; gap:10px; min-height:96px;
  }
  .card.on{border-color:rgba(61,169,252,.5); background:linear-gradient(160deg,var(--panel2),var(--panel));}
  .card-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .card-name{font-size:13px; font-weight:600; line-height:1.3;}
  .card-domain{font-size:10px; color:var(--sub); margin-top:2px;}
  .card-state{font-size:11px; color:var(--sub);}
  .toggle{
    width:46px; height:26px; border-radius:999px; background:#28324d; position:relative; cursor:pointer;
    border:none; flex:none; transition:background .15s;
  }
  .toggle.on{background:var(--accent2);}
  .toggle .knob{
    position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%;
    background:#fff; transition:left .15s;
  }
  .toggle.on .knob{left:23px;}
  .slider-row{display:flex; align-items:center; gap:8px;}
  .slider-row input[type=range]{flex:1; accent-color:var(--accent);}
  .slider-val{font-size:11px; color:var(--sub); width:34px; text-align:right;}
  .run-btn{
    align-self:flex-start; background:var(--accent); color:#08233f; border:none; border-radius:8px;
    padding:8px 14px; font-size:12px; font-weight:700; cursor:pointer;
  }
  .sensor-value{font-size:22px; font-weight:700;}
  .sensor-unit{font-size:12px; color:var(--sub); margin-left:4px;}
  .empty{color:var(--sub); font-size:13px; text-align:center; padding:40px 10px;}
  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:#1c2c4d; border:1px solid var(--border); color:var(--text);
    padding:10px 16px; border-radius:10px; font-size:13px; z-index:50; opacity:0; transition:opacity .25s;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .toast.show{opacity:1;}

  /* ---------- Settings modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(5,9,18,.6); display:none; align-items:center; justify-content:center;
    z-index:100; padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:22px; width:100%; max-width:420px; max-height:90vh; overflow-y:auto;
  }
  .modal h2{font-size:16px; margin:0 0 14px;}
  .modal-foot{display:flex; gap:8px; margin-top:16px;}
  .modal-foot .btn{flex:1;}
  .demo-badge{
    display:inline-block; font-size:10px; padding:3px 8px; border-radius:999px;
    background:rgba(245,158,11,.15); color:var(--warn); border:1px solid rgba(245,158,11,.4); margin-left:8px;
  }
</style>
</head>
<body>

<!-- ===================== 연결 화면 ===================== -->
<div id="gate">
  <div class="gate-card">
    <h1 id="gateTitle">sorinamoo assistant 연결</h1>
    <p>Home&nbsp;Assistant 서버 주소와 장기 액세스 토큰(Long-Lived Access Token)을 입력하면, 이 화면이 sorinamoo assistant 전용 제어 앱으로 전환됩니다.</p>
    <div class="field">
      <label>브랜드/현장 이름</label>
      <input id="inBrand" placeholder="예: sorinamoo assistant" value="sorinamoo assistant" />
    </div>
    <div class="field">
      <label>Home Assistant 서버 주소</label>
      <input id="inUrl" placeholder="http://192.168.0.10:8123" />
    </div>
    <div class="field">
      <label>Long-Lived Access Token</label>
      <input id="inToken" type="password" placeholder="프로필 &gt; 보안 탭에서 발급" />
    </div>
    <button class="btn btn-primary" onclick="connectFromGate()">연결하기</button>
    <div class="gate-error" id="gateError"></div>
    <div class="gate-demo">
      <button class="btn btn-ghost" onclick="enterDemo()">서버 없이 데모로 먼저 체험하기</button>
      <div style="margin-top:8px;"><span>토큰 발급: HA 화면 우측 하단 프로필 → 보안 탭 → "토큰 만들기"</span></div>
    </div>
  </div>
</div>

<!-- ===================== 메인 앱 ===================== -->
<div id="app">
  <header>
    <div class="brand">
      <div class="dot" id="connDot"></div>
      <div>
        <div class="brand-name" id="brandName">sorinamoo assistant</div>
        <div class="brand-sub" id="brandSub">연결 중...</div>
      </div>
    </div>
    <div class="head-actions">
      <button class="icon-btn" title="새로고침" onclick="refreshNow()">⟳</button>
      <button class="icon-btn" title="설정" onclick="openSettings()">⚙</button>
    </div>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <div class="search-row">
    <input id="searchBox" placeholder="기기 이름으로 검색..." oninput="render()" />
  </div>

  <main id="main"></main>
</div>

<div class="toast" id="toast"></div>

<!-- ===================== 설정 모달 ===================== -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h2>설정</h2>
    <div class="field">
      <label>브랜드/현장 이름</label>
      <input id="setBrand" />
    </div>
    <div class="field">
      <label>Home Assistant 서버 주소</label>
      <input id="setUrl" />
    </div>
    <div class="field">
      <label>Long-Lived Access Token</label>
      <input id="setToken" type="password" />
    </div>
    <div class="field">
      <label>자동 새로고침 주기 (초)</label>
      <input id="setPoll" type="number" min="2" max="60" />
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeSettings()">취소</button>
      <button class="btn btn-primary" onclick="saveSettings()">저장</button>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" style="color:var(--danger);" onclick="disconnect()">연결 해제 / 로그아웃</button>
    </div>
  </div>
</div>

<script>
/* =========================================================================
   상태 저장 (localStorage)
   ========================================================================= */
const STORAGE_KEY = "ops-console-config-v1";

function loadConfig(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || null; }catch(e){ return null; }
}
function saveConfig(cfg){ localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg)); }

let CFG = loadConfig();           // {brand, url, token, poll, demo}
let ENTITIES = [];                // 현재 상태 캐시
let ACTIVE_TAB = "all";
let pollTimer = null;

/* =========================================================================
   데모 데이터
   ========================================================================= */
function demoEntities(){
  return [
    {entity_id:"light.stage_main", state:"on", attributes:{friendly_name:"메인 무대 조명", brightness:200, supported_color_modes:["brightness"]}},
    {entity_id:"light.stage_side", state:"off", attributes:{friendly_name:"보조 조명", brightness:0, supported_color_modes:["brightness"]}},
    {entity_id:"switch.entrance_led", state:"on", attributes:{friendly_name:"입구 LED 사인"}},
    {entity_id:"switch.water_feature", state:"off", attributes:{friendly_name:"분수 장치"}},
    {entity_id:"media_player.main_speaker", state:"playing", attributes:{friendly_name:"메인 음향 시스템", volume_level:0.6}},
    {entity_id:"sensor.outdoor_temp", state:"24.5", attributes:{friendly_name:"현장 기온", unit_of_measurement:"°C"}},
    {entity_id:"sensor.crowd_noise", state:"68", attributes:{friendly_name:"소음 레벨", unit_of_measurement:"dB"}},
    {entity_id:"binary_sensor.gate_motion", state:"off", attributes:{friendly_name:"출입구 동작감지"}},
    {entity_id:"scene.opening_cue", state:"scening", attributes:{friendly_name:"오프닝 큐"}},
    {entity_id:"scene.finale_cue", state:"scening", attributes:{friendly_name:"피날레 큐"}},
    {entity_id:"script.emergency_lights", state:"off", attributes:{friendly_name:"비상 조명 전환"}},
  ];
}

/* =========================================================================
   화면 전환
   ========================================================================= */
function showApp(){
  document.getElementById("gate").style.display = "none";
  document.getElementById("app").classList.add("ready");
}
function showGate(){
  document.getElementById("app").classList.remove("ready");
  document.getElementById("gate").style.display = "flex";
}

function connectFromGate(){
  const brand = document.getElementById("inBrand").value.trim() || "운영 콘솔";
  const url = document.getElementById("inUrl").value.trim().replace(/\/$/,"");
  const token = document.getElementById("inToken").value.trim();
  const errEl = document.getElementById("gateError");
  errEl.textContent = "";

  if(!url || !token){
    errEl.textContent = "서버 주소와 토큰을 모두 입력해주세요.";
    return;
  }
  CFG = {brand, url, token, poll:5, demo:false};
  saveConfig(CFG);
  testConnectionThenStart(true);
}

function enterDemo(){
  CFG = {brand:"sorinamoo assistant (데모)", url:"", token:"", poll:5, demo:true};
  saveConfig(CFG);
  startApp();
}

/* =========================================================================
   HA API
   ========================================================================= */
async function haFetch(path, opts={}){
  const res = await fetch(CFG.url + path, {
    ...opts,
    headers:{
      "Authorization": "Bearer " + CFG.token,
      "Content-Type": "application/json",
      ...(opts.headers||{})
    }
  });
  if(!res.ok) throw new Error("HTTP " + res.status);
  return res.status === 204 ? null : res.json();
}

async function testConnectionThenStart(fromGate){
  try{
    await haFetch("/api/");
    if(fromGate) startApp();
  }catch(e){
    if(fromGate){
      document.getElementById("gateError").textContent =
        "연결 실패: 주소/토큰을 확인하거나 CORS 설정을 확인해주세요. (" + e.message + ")";
    }
  }
}

async function fetchStates(){
  if(CFG.demo){
    return ENTITIES.length ? ENTITIES : demoEntities();
  }
  return await haFetch("/api/states");
}

async function callService(domain, service, data){
  if(CFG.demo){
    applyDemoChange(domain, service, data);
    return;
  }
  await haFetch(`/api/services/${domain}/${service}`, {
    method:"POST",
    body: JSON.stringify(data || {})
  });
}

function applyDemoChange(domain, service, data){
  const ent = ENTITIES.find(e => e.entity_id === data.entity_id);
  if(!ent) return;
  if(service === "turn_on"){
    ent.state = domain === "media_player" ? "playing" : "on";
    if(data.brightness_pct !== undefined) ent.attributes.brightness = Math.round(data.brightness_pct * 2.55);
    if(data.volume_level !== undefined) ent.attributes.volume_level = data.volume_level;
  } else if(service === "turn_off"){
    ent.state = "off";
  }
  render();
}

/* =========================================================================
   메인 루프
   ========================================================================= */
function startApp(){
  document.getElementById("brandName").textContent = CFG.brand || "sorinamoo assistant";
  document.getElementById("setBrand").value = CFG.brand || "";
  document.getElementById("setUrl").value = CFG.url || "";
  document.getElementById("setToken").value = CFG.token || "";
  document.getElementById("setPoll").value = CFG.poll || 5;
  showApp();
  buildTabs();
  refreshNow();
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(refreshNow, Math.max(2,(CFG.poll||5)) * 1000);
}

async function refreshNow(){
  const dot = document.getElementById("connDot");
  const sub = document.getElementById("brandSub");
  try{
    ENTITIES = await fetchStates();
    dot.classList.add("on");
    sub.textContent = CFG.demo ? "데모 모드" : (ENTITIES.length + "개 기기 연결됨");
    render();
  }catch(e){
    dot.classList.remove("on");
    sub.textContent = "연결 끊김";
    showToast("업데이트 실패: " + e.message);
  }
}

/* =========================================================================
   분류 / 탭
   ========================================================================= */
const TAB_DEFS = [
  {id:"all", label:"전체", match:()=>true},
  {id:"light", label:"조명", match:e=>e.entity_id.startsWith("light.")},
  {id:"switch", label:"스위치/설치물", match:e=>e.entity_id.startsWith("switch.")||e.entity_id.startsWith("input_boolean.")},
  {id:"media_player", label:"음향", match:e=>e.entity_id.startsWith("media_player.")},
  {id:"sensor", label:"센서/환경", match:e=>e.entity_id.startsWith("sensor.")||e.entity_id.startsWith("binary_sensor.")||e.entity_id.startsWith("climate.")},
  {id:"scene", label:"장면/자동화", match:e=>e.entity_id.startsWith("scene.")||e.entity_id.startsWith("script.")||e.entity_id.startsWith("automation.")},
];

function buildTabs(){
  const nav = document.getElementById("tabs");
  nav.innerHTML = "";
  TAB_DEFS.forEach(t=>{
    const b = document.createElement("button");
    b.textContent = t.label;
    b.className = t.id === ACTIVE_TAB ? "active" : "";
    b.onclick = ()=>{ ACTIVE_TAB = t.id; buildTabs(); render(); };
    nav.appendChild(b);
  });
}

/* =========================================================================
   렌더링
   ========================================================================= */
function domainOf(id){ return id.split(".")[0]; }
function nameOf(e){ return (e.attributes && e.attributes.friendly_name) || e.entity_id; }

function render(){
  const main = document.getElementById("main");
  const q = (document.getElementById("searchBox").value || "").toLowerCase();
  const tabDef = TAB_DEFS.find(t=>t.id===ACTIVE_TAB) || TAB_DEFS[0];

  let list = ENTITIES.filter(tabDef.match);
  if(q) list = list.filter(e => nameOf(e).toLowerCase().includes(q));

  if(list.length === 0){
    main.innerHTML = '<div class="empty">표시할 기기가 없습니다.</div>';
    return;
  }

  const groups = {};
  list.forEach(e=>{
    const d = domainOf(e.entity_id);
    (groups[d] = groups[d]||[]).push(e);
  });

  let html = "";
  Object.keys(groups).sort().forEach(d=>{
    html += `<div class="section-title">${domainLabel(d)}</div><div class="grid">`;
    groups[d].forEach(e=>{ html += cardHtml(e); });
    html += `</div>`;
  });
  main.innerHTML = html;
}

function domainLabel(d){
  return ({
    light:"조명", switch:"스위치", input_boolean:"스위치", media_player:"음향",
    sensor:"센서", binary_sensor:"감지 센서", climate:"환경 제어",
    scene:"장면", script:"스크립트", automation:"자동화"
  })[d] || d;
}

function cardHtml(e){
  const d = domainOf(e.entity_id);
  const name = nameOf(e);
  const isOn = ["on","playing","home"].includes(e.state);

  if(d === "light" || d === "switch" || d === "input_boolean"){
    const hasBrightness = d === "light" && e.attributes && e.attributes.supported_color_modes &&
      e.attributes.supported_color_modes.includes("brightness");
    const brightPct = hasBrightness ? Math.round(((e.attributes.brightness||0)/255)*100) : null;
    return `
      <div class="card ${isOn?'on':''}">
        <div class="card-top">
          <div>
            <div class="card-name">${esc(name)}</div>
            <div class="card-domain">${e.entity_id}</div>
          </div>
          <button class="toggle ${isOn?'on':''}" onclick="toggleEntity('${e.entity_id}','${d}',${isOn})">
            <span class="knob"></span>
          </button>
        </div>
        ${hasBrightness ? `
        <div class="slider-row">
          <input type="range" min="1" max="100" value="${brightPct}" oninput="setBrightness('${e.entity_id}',this.value)">
          <span class="slider-val">${brightPct}%</span>
        </div>` : `<div class="card-state">${isOn?'켜짐':'꺼짐'}</div>`}
      </div>`;
  }

  if(d === "media_player"){
    const vol = Math.round((e.attributes && e.attributes.volume_level || 0)*100);
    return `
      <div class="card ${isOn?'on':''}">
        <div class="card-top">
          <div>
            <div class="card-name">${esc(name)}</div>
            <div class="card-domain">${e.state}</div>
          </div>
          <button class="toggle ${isOn?'on':''}" onclick="toggleMedia('${e.entity_id}',${isOn})">
            <span class="knob"></span>
          </button>
        </div>
        <div class="slider-row">
          <input type="range" min="0" max="100" value="${vol}" oninput="setVolume('${e.entity_id}',this.value)">
          <span class="slider-val">${vol}%</span>
        </div>
      </div>`;
  }

  if(d === "sensor" || d === "binary_sensor"){
    const unit = (e.attributes && e.attributes.unit_of_measurement) || "";
    return `
      <div class="card">
        <div class="card-name">${esc(name)}</div>
        <div><span class="sensor-value">${esc(e.state)}</span><span class="sensor-unit">${esc(unit)}</span></div>
      </div>`;
  }

  if(d === "scene" || d === "script"){
    return `
      <div class="card">
        <div class="card-name">${esc(name)}</div>
        <div class="card-domain">${e.entity_id}</div>
        <button class="run-btn" onclick="runScene('${e.entity_id}','${d}')">▶ 실행</button>
      </div>`;
  }

  return `
    <div class="card">
      <div class="card-name">${esc(name)}</div>
      <div class="card-state">${esc(e.state)}</div>
    </div>`;
}

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* =========================================================================
   동작
   ========================================================================= */
async function toggleEntity(entityId, domain, isOn){
  try{
    await callService(domain === "input_boolean" ? "input_boolean" : domain, isOn ? "turn_off" : "turn_on", {entity_id:entityId});
    showToast((isOn?"끄기":"켜기") + " 명령 전송됨");
    setTimeout(refreshNow, 400);
  }catch(e){ showToast("명령 실패: " + e.message); }
}

async function setBrightness(entityId, pct){
  try{
    await callService("light", "turn_on", {entity_id:entityId, brightness_pct:Number(pct)});
  }catch(e){ showToast("밝기 조절 실패: " + e.message); }
}

async function toggleMedia(entityId, isOn){
  try{
    await callService("media_player", isOn?"media_pause":"media_play", {entity_id:entityId});
    setTimeout(refreshNow, 400);
  }catch(e){ showToast("명령 실패: " + e.message); }
}

async function setVolume(entityId, pct){
  try{
    await callService("media_player", "volume_set", {entity_id:entityId, volume_level:Number(pct)/100});
  }catch(e){ showToast("볼륨 조절 실패: " + e.message); }
}

async function runScene(entityId, domain){
  try{
    await callService(domain, domain==="scene"?"turn_on":"turn_on", {entity_id:entityId});
    showToast("실행됨: " + entityId);
    setTimeout(refreshNow, 400);
  }catch(e){ showToast("실행 실패: " + e.message); }
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove("show"), 2500);
}

/* =========================================================================
   설정 모달
   ========================================================================= */
function openSettings(){ document.getElementById("settingsModal").classList.add("open"); }
function closeSettings(){ document.getElementById("settingsModal").classList.remove("open"); }

function saveSettings(){
  CFG.brand = document.getElementById("setBrand").value.trim() || "sorinamoo assistant";
  CFG.url = document.getElementById("setUrl").value.trim().replace(/\/$/,"");
  CFG.token = document.getElementById("setToken").value.trim();
  CFG.poll = Number(document.getElementById("setPoll").value) || 5;
  saveConfig(CFG);
  closeSettings();
  startApp();
}

function disconnect(){
  localStorage.removeItem(STORAGE_KEY);
  CFG = null;
  if(pollTimer) clearInterval(pollTimer);
  closeSettings();
  showGate();
}

/* =========================================================================
   초기 진입
   ========================================================================= */
(function init(){
  if(CFG && (CFG.demo || (CFG.url && CFG.token))){
    startApp();
  }else{
    showGate();
  }
})();

/* PWA Service Worker 등록 */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("service-worker.js").catch(()=>{});
  });
}
</script>
